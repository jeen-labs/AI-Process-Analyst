###############################################################################
# AI Process Analyst
#
# LLM Configuration
#
# This file contains the runtime configuration for the configured
# Large Language Model (LLM).
#
# The application should read these settings rather than hardcoding
# provider-specific values inside Python modules.
###############################################################################

# =============================================================================
# Active Provider
# =============================================================================

provider: openai

# Supported providers (planned):
#
# openai
# gemini
# azure_openai
# anthropic
# ollama
# local
#

# =============================================================================
# Model Configuration
# =============================================================================

model: gpt-5.5

temperature: 0.1

max_tokens: 4000

top_p: 1.0

frequency_penalty: 0.0

presence_penalty: 0.0

timeout_seconds: 60

# =============================================================================
# API Configuration
# =============================================================================

base_url: https://api.openai.com/v1

api_key_environment_variable: OPENAI_API_KEY

# Never store API keys inside this repository.
#
# API keys must be provided through environment variables.

# =============================================================================
# Response Configuration
# =============================================================================

response_format: json

stream: false

# =============================================================================
# Retry Policy
# =============================================================================

retry_attempts: 3

retry_delay_seconds: 2

# =============================================================================
# Logging
# =============================================================================

log_requests: true

log_responses: false

log_token_usage: true

# =============================================================================
# Prompt Configuration
# =============================================================================

system_prompt_file: prompts/extraction_prompt.md

# =============================================================================
# Future Features
# =============================================================================

enable_function_calling: false

enable_tools: false

enable_structured_output: true

enable_reasoning_mode: false

reasoning_effort: medium

###############################################################################
# End of File
###############################################################################
