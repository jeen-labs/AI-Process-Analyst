###############################################################################
# AI Process Analyst
#
# LLM Configuration
#
# This file contains the runtime configuration for the configured
# Large Language Model (LLM).
###############################################################################

# =============================================================================
# Active Provider
# =============================================================================

provider: gemini

# Supported providers
#
# openai
# gemini
# anthropic
# azure_openai
# ollama
# mock
#

# =============================================================================
# Model Configuration
# =============================================================================

model: gemini-flash-latest

temperature: 0.1

max_tokens: 4000

top_p: 1.0

frequency_penalty: 0.0

presence_penalty: 0.0

timeout_seconds: 60

# =============================================================================
# API Configuration
# =============================================================================

base_url: https://generativelanguage.googleapis.com

api_key_environment_variable: GOOGLE_API_KEY

# Never store API keys in source control.
# Use environment variables instead.

# =============================================================================
# Response Configuration
# =============================================================================

response_format: json

stream: false

# =============================================================================
# Retry Configuration
# =============================================================================

retry_attempts: 5

retry_delay_seconds: 2

retry_exponential_backoff: true

max_retry_delay_seconds: 30

# =============================================================================
# Processing Configuration
# =============================================================================

document_processing_delay_seconds: 2

# =============================================================================
# Logging
# =============================================================================

log_requests: true

log_responses: false

log_token_usage: true

log_response_time: true

log_retry_attempts: true

# =============================================================================
# Prompt Configuration
# =============================================================================

system_prompt_file: prompts/extraction_prompt.md

# =============================================================================
# Future Features
# =============================================================================

enable_function_calling: false

enable_tools: false

enable_structured_output: true

enable_reasoning_mode: false

reasoning_effort: medium

###############################################################################
# End of File
###############################################################################
